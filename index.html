<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact · machinelearning2014</title>
  <style>
    /* Tokens mirror the SYMEVO sign-in page (src/server/auth-server.ts). This page is a separate
       repository, so the values are duplicated rather than imported — keep them in step. */
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --canvas: #212121;
      --sidebar: #181818;
      --raised: #303030;
      --hover: #383838;
      --border: #424242;
      --text: #ececec;
      --text-secondary: #b4b4b4;
      --text-muted: #8f8f8f;
      --accent: #ececec;
      --error: #f85149;
      --shadow: rgba(0, 0, 0, .45);
    }
    :root[data-theme="dark"] {
      --canvas: #212121; --sidebar: #181818; --raised: #303030; --hover: #383838;
      --border: #424242; --text: #ececec; --text-secondary: #b4b4b4;
      --text-muted: #8f8f8f; --accent: #ececec; --error: #f85149;
      --shadow: rgba(0, 0, 0, .45);
    }
    :root[data-theme="light"] {
      --canvas: #fff; --sidebar: #f9f9f9; --raised: #f4f4f4; --hover: #ececec;
      --border: #e0e0e0; --text: #1f1f1f; --text-secondary: #4f4f4f;
      --text-muted: #8f8f8f; --accent: #1f1f1f; --error: #cf222e;
      --shadow: rgba(0, 0, 0, .12);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --canvas: #fff; --sidebar: #f9f9f9; --raised: #f4f4f4; --hover: #ececec;
        --border: #e0e0e0; --text: #1f1f1f; --text-secondary: #4f4f4f;
        --text-muted: #8f8f8f; --accent: #1f1f1f; --error: #cf222e;
        --shadow: rgba(0, 0, 0, .12);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--canvas);
      color: var(--text);
      font-family: inherit;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .container { width: 100%; max-width: 440px; }

    .header { text-align: center; margin-bottom: 22px; }

    h1 {
      font-size: 28px;
      font-weight: 750;
      letter-spacing: -.01em;
      line-height: 1.15;
    }
    h1 span { color: var(--text-muted); }

    .subtitle {
      margin: 8px 0 0;
      font-size: 15px;
      color: var(--text-secondary);
    }

    .card {
      padding: 36px 34px 30px;
      background: var(--canvas);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 48px var(--shadow);
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 15px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: 0;
      transition: border-color .15s ease;
    }
    input:focus, textarea:focus { border-color: var(--text-muted); }
    input::placeholder, textarea::placeholder { color: var(--text-muted); }
    textarea { min-height: 104px; resize: vertical; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .btn {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--canvas);
      border: 1px solid var(--accent);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s ease;
    }
    .btn:hover:not(:disabled) { opacity: .88; }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn:focus-visible { outline: 2px solid var(--text-muted); outline-offset: 2px; }
    .btn-inner { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

    .success { display: none; text-align: center; padding: 10px 0 4px; }
    .success-icon {
      width: 44px; height: 44px;
      margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--raised);
      color: var(--text);
    }
    .success h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.01em;
      margin-bottom: 6px;
    }
    .success p { color: var(--text-muted); font-size: 14px; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>SYMEVO <span>Registration</span></h1>
    <p class="subtitle">Fill in the form to request experimental access to SYMEVO.</p>
  </div>

  <div class="card">
    <!-- Form -->
    <div id="form-wrap">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Ada Lovelace" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="ada@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="reason">Reason for Requesting Access</label>
        <input type="text" id="reason" placeholder="Describe why you're requesting access…" />
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Any other comments…"></textarea>
      </div>

      <div class="divider"></div>

      <button class="btn" id="submit-btn" onclick="submitForm()">
        <span class="btn-inner" id="btn-label">
          Send Message
        </span>
      </button>
      <p id="form-error" style="display:none; color:var(--error); font-size:13px; text-align:center; margin-top:14px;"></p>
    </div>

    <!-- Success -->
    <div class="success" id="success">
      <div class="success-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2>Message Received</h2>
      <p>Thanks for reaching out! I'll get back to you as soon as possible.</p>
    </div>
  </div>

</div>

<script>
  // Mirrors the sign-in page: an explicit choice wins, otherwise follow the OS.
  (function () {
    try {
      var stored = localStorage.getItem('evo-theme');
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) { /* storage can throw in private modes; the OS preference still applies */ }
  })();

  async function submitForm() {
    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const reason  = document.getElementById('reason').value;
    const message = document.getElementById('message').value.trim();
    const errEl   = document.getElementById('form-error');

    errEl.style.display = 'none';

    // Client-side validation
    const fields = [
      { el: document.getElementById('name'),    val: name    },
      { el: document.getElementById('email'),   val: email   },
      { el: document.getElementById('reason'),  val: reason  },
      { el: document.getElementById('message'), val: message },
    ];

    let hasError = false;
    fields.forEach(f => {
      if (!f.val) {
        f.el.style.borderColor = 'var(--error)';
        f.el.addEventListener('input',  () => f.el.style.borderColor = '', { once: true });
        f.el.addEventListener('change', () => f.el.style.borderColor = '', { once: true });
        hasError = true;
      }
    });
    if (hasError) return;

    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRe.test(email)) {
      const el = document.getElementById('email');
      el.style.borderColor = 'var(--error)';
      el.addEventListener('input', () => el.style.borderColor = '', { once: true });
      return;
    }

    // Disable button & show loading
    const btn   = document.getElementById('submit-btn');
    const label = document.getElementById('btn-label');
    btn.disabled = true;
    label.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite">
        <path d="M21 12a9 9 0 1 1-6.22-8.56"/>
      </svg>
      Sending…`;

    // Submit to Formspree
    try {
      const res = await fetch('https://formspree.io/f/xjgeabez', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, reason, message })
      });

      if (res.ok) {
        // Show success screen
        const wrap = document.getElementById('form-wrap');
        const succ = document.getElementById('success');
        wrap.style.transition = 'opacity 0.3s';
        wrap.style.opacity = '0';
        setTimeout(() => {
          wrap.style.display = 'none';
          succ.style.display = 'block';
        }, 300);
      } else {
        throw new Error('Server error');
      }
    } catch (e) {
      errEl.textContent = 'Something went wrong. Please try again or email directly.';
      errEl.style.display = 'block';
      btn.disabled = false;
      label.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        Send Message`;
    }
  }
</script>
</body>
</html>
