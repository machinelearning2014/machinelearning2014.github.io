<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact · machinelearning2014</title>
  <!-- IBM Plex is loaded from jsDelivr because the SYMEVO app's CSP allows only that origin for
       stylesheets and fonts. Keeping the same source here means both stay in step. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/ibm-plex-sans@5/index.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-condensed@5/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-condensed@5/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono@5/500.css">
  <style>
    /* Palette shared with the SYMEVO sign-in page and dashboard (src/ui/theme.ts). This page is a
       separate repository, so the values are duplicated here rather than imported — keep them in
       step with src/ui/theme.ts when that palette changes. */
    :root {
      color-scheme: light dark;
      --ui-display: "IBM Plex Sans Condensed", "Helvetica Neue", Arial, sans-serif;
      --ui-body: "IBM Plex Sans Variable", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ui-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --canvas: #0E1419;
      --surface: #161E26;
      --sunk: #1C252E;
      --border: #26313C;
      --border-strong: #384654;
      --text: #E4E9EF;
      --muted: #97A3B1;
      --accent: #D9A441;
      --accent-soft: #2B2418;
      --accent-ink: #EFC271;
      --good: #6FBF95;
      --send-fg: #0E1419;
      --error: #f85149;
      --shadow: rgba(0, 0, 0, .45);
    }
    :root[data-theme="light"] {
      --canvas: #F4F6F8; --surface: #FFFFFF; --sunk: #EDF0F4;
      --border: #DFE4EA; --border-strong: #C6CFD9;
      --text: #121A23; --muted: #5B6875;
      --accent: #8A5A12; --accent-soft: #F5E9D4; --accent-ink: #6B4409;
      --good: #2F6B4F; --send-fg: #FFFFFF; --error: #cf222e;
      --shadow: rgba(0, 0, 0, .12);
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --canvas: #F4F6F8; --surface: #FFFFFF; --sunk: #EDF0F4;
        --border: #DFE4EA; --border-strong: #C6CFD9;
        --text: #121A23; --muted: #5B6875;
        --accent: #8A5A12; --accent-soft: #F5E9D4; --accent-ink: #6B4409;
        --good: #2F6B4F; --send-fg: #FFFFFF; --error: #cf222e;
        --shadow: rgba(0, 0, 0, .12);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--canvas);
      color: var(--text);
      font-family: var(--ui-body);
      font-size: .9375rem;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container { width: 100%; max-width: 520px; }

    .header { text-align: center; margin-bottom: 24px; }

    .eyebrow {
      font-family: var(--ui-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }

    h1 {
      font-family: var(--ui-display);
      font-size: 34px;
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -.015em;
    }
    h1 span { color: var(--muted); font-weight: 600; }

    .subtitle { margin-top: 8px; color: var(--muted); font-size: 14px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 28px;
      box-shadow: 0 12px 40px var(--shadow);
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-family: var(--ui-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
      transition: color .15s ease;
    }
    .field:focus-within label { color: var(--accent); }

    input, textarea {
      width: 100%;
      background: var(--sunk);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 11px 13px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: border-color .15s ease, background .15s ease;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface);
    }
    input::placeholder, textarea::placeholder { color: var(--muted); }
    textarea { min-height: 104px; resize: vertical; }

    .divider { height: 1px; background: var(--border); margin: 22px 0; }

    .btn {
      width: 100%;
      background: var(--accent);
      color: var(--send-fg);
      border: 1px solid var(--accent);
      border-radius: 4px;
      padding: 13px 18px;
      font-family: var(--ui-body);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }
    .btn:disabled { opacity: .7; cursor: default; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-inner { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

    .success { display: none; text-align: center; padding: 8px 0; }
    .success-icon {
      width: 44px; height: 44px;
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--sunk);
      color: var(--good);
    }
    .success h2 {
      font-family: var(--ui-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.01em;
      margin-bottom: 6px;
    }
    .success p { color: var(--muted); font-size: 14px; }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <p class="eyebrow">Request access</p>
    <h1>SYMEVO <span>Registration</span></h1>
    <p class="subtitle">Fill in the form to request experimental access to SYMEVO.</p>
  </div>

  <div class="card">
    <!-- Form -->
    <div id="form-wrap">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Ada Lovelace" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="ada@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="reason">Reason for Requesting Access</label>
        <input type="text" id="reason" placeholder="Describe why you're requesting access…" />
      </div>

      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Any other comments…"></textarea>
      </div>

      <div class="divider"></div>

      <button class="btn" id="submit-btn" onclick="submitForm()">
        <span class="btn-inner" id="btn-label">
          Send Message
        </span>
      </button>
      <p id="form-error" style="display:none; color:var(--error); font-size:13px; text-align:center; margin-top:14px;"></p>
    </div>

    <!-- Success -->
    <div class="success" id="success">
      <div class="success-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2>Message Received</h2>
      <p>Thanks for reaching out! I'll get back to you as soon as possible.</p>
    </div>
  </div>

</div>

<script>
  // Mirrors the sign-in page: an explicit choice wins, otherwise follow the OS.
  (function () {
    try {
      var stored = localStorage.getItem('evo-theme');
      if (stored === 'light' || stored === 'dark') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) { /* storage can throw in private modes; the OS preference still applies */ }
  })();

  async function submitForm() {
    const name    = document.getElementById('name').value.trim();
    const email   = document.getElementById('email').value.trim();
    const reason  = document.getElementById('reason').value;
    const message = document.getElementById('message').value.trim();
    const errEl   = document.getElementById('form-error');

    errEl.style.display = 'none';

    // Client-side validation
    const fields = [
      { el: document.getElementById('name'),    val: name    },
      { el: document.getElementById('email'),   val: email   },
      { el: document.getElementById('reason'),  val: reason  },
      { el: document.getElementById('message'), val: message },
    ];

    let hasError = false;
    fields.forEach(f => {
      if (!f.val) {
        f.el.style.borderColor = 'var(--error)';
        f.el.addEventListener('input',  () => f.el.style.borderColor = '', { once: true });
        f.el.addEventListener('change', () => f.el.style.borderColor = '', { once: true });
        hasError = true;
      }
    });
    if (hasError) return;

    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRe.test(email)) {
      const el = document.getElementById('email');
      el.style.borderColor = 'var(--error)';
      el.addEventListener('input', () => el.style.borderColor = '', { once: true });
      return;
    }

    // Disable button & show loading
    const btn   = document.getElementById('submit-btn');
    const label = document.getElementById('btn-label');
    btn.disabled = true;
    label.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 0.8s linear infinite">
        <path d="M21 12a9 9 0 1 1-6.22-8.56"/>
      </svg>
      Sending…`;

    // Submit to Formspree
    try {
      const res = await fetch('https://formspree.io/f/xjgeabez', {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, reason, message })
      });

      if (res.ok) {
        // Show success screen
        const wrap = document.getElementById('form-wrap');
        const succ = document.getElementById('success');
        wrap.style.transition = 'opacity 0.3s';
        wrap.style.opacity = '0';
        setTimeout(() => {
          wrap.style.display = 'none';
          succ.style.display = 'block';
        }, 300);
      } else {
        throw new Error('Server error');
      }
    } catch (e) {
      errEl.textContent = 'Something went wrong. Please try again or email directly.';
      errEl.style.display = 'block';
      btn.disabled = false;
      label.innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        Send Message`;
    }
  }
</script>
</body>
</html>
